services:
  - type: web
    name: fake-job-detector
    env: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_PATH
        value: /var/data/app.db
      - key: IP_HASH_SALT
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        value: "*"
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
